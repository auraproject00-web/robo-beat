<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Robo Beat: game lari tanpa henti. Pilih karakter, lompati kardus dan drum oli, hindari gagak.">
<meta name="theme-color" content="#0f1a2b">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }
img { max-width: 100%; }
</style>
<title>Robo Beat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-screen arcade. The pixel world fills the screen; menu, HUD, pad and dialogs float on top. */
:root {
  --night: #0f1a2b;
  --ink: #f4f7fb;
  --muted: #a9b6cc;
  --panel: rgba(13, 19, 34, 0.84);
  --line: rgba(255, 255, 255, 0.2);
  --accent: #ffb21f;
  --accent-deep: #c97c00;
  --accent-ink: #231603;
  --hero: #ff4f9a;
  --font-display: "Silkscreen", ui-monospace, "Courier New", monospace;
  --font-body: "IBM Plex Mono", ui-monospace, "Courier New", monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; background: var(--night); color: var(--ink);
  font-family: var(--font-body);
  user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.outline {
  text-shadow: 2px 0 #11151d, -2px 0 #11151d, 0 2px #11151d, 0 -2px #11151d,
               2px 2px #11151d, -2px -2px #11151d, 2px -2px #11151d, -2px 2px #11151d;
}

#cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

/* ---------- menu ---------- */
#menu {
  position: fixed; inset: 0; overflow-y: auto; z-index: 5;
  background: linear-gradient(180deg, rgba(8, 12, 24, 0.5), rgba(8, 12, 24, 0.82));
  padding-inline: 16px;
  padding-block: calc(env(safe-area-inset-top, 0px) + 22px) calc(env(safe-area-inset-bottom, 0px) + 22px);
  display: flex;
}
.menu-inner {
  width: min(460px, 100%); margin: auto;
  display: grid; gap: 16px;
  grid-template-areas: "title" "show" "pick" "start" "opts";
}
.brand { grid-area: title; text-align: center; display: grid; gap: 8px; }
.title {
  margin: 0; font-family: var(--font-display); font-weight: 700;
  font-size: clamp(2.3rem, 12vw, 3.6rem); line-height: 0.95; letter-spacing: 0.04em; color: #fff;
  text-shadow: 3px 3px 0 var(--hero), 6px 6px 0 #11151d;
  transition: text-shadow 0.25s;
}
.best { font-family: var(--font-display); font-size: 0.95rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.best b { color: var(--ink); font-weight: 400; }

.show {
  grid-area: show; display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 8px;
}
.show-stage { display: grid; justify-items: center; gap: 6px; }
#bigPreview { width: min(220px, 60vw); aspect-ratio: 2 / 1; image-rendering: pixelated; max-width: 100%; }
.hero-name { font-family: var(--font-display); font-size: 1.5rem; letter-spacing: 0.05em; }
.hero-tag { font-size: 0.8rem; color: var(--muted); text-align: center; min-height: 1.2em; }
.arrow {
  height: 44px; border-radius: 8px; background: var(--panel); border: 2px solid var(--line);
  font-family: var(--font-display); font-size: 1.1rem;
}

.pick { grid-area: pick; display: grid; gap: 8px; }
.label { font-family: var(--font-display); font-size: 0.8rem; color: var(--muted); letter-spacing: 0.08em; }
.chars { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.char {
  display: grid; justify-items: center; gap: 4px; padding: 8px 6px 6px;
  background: var(--panel); border: 2px solid var(--line); border-radius: 8px;
  font-family: var(--font-display); font-size: 0.78rem;
}
.char canvas { width: 100%; max-width: 96px; aspect-ratio: 8 / 5; image-rendering: pixelated; }
.char[aria-pressed="true"] { border-color: var(--accent); background: rgba(255, 178, 31, 0.14); color: var(--accent); }

.start {
  grid-area: start;
  font-family: var(--font-display); font-weight: 700; font-size: 1.45rem; letter-spacing: 0.08em;
  color: var(--accent-ink); background: var(--accent);
  border: 0; border-radius: 10px; padding-block: 16px 12px;
  box-shadow: 0 5px 0 var(--accent-deep);
}
.start:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--accent-deep); }
.opts { grid-area: opts; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
.chip {
  font-family: var(--font-display); font-size: 0.8rem; padding: 8px 12px;
  background: transparent; border: 2px solid var(--line); border-radius: 6px;
}
.keys { font-size: 0.75rem; color: var(--muted); text-align: center; line-height: 1.6; }

@media (orientation: landscape) and (max-height: 560px) {
  .menu-inner {
    width: min(860px, 100%); column-gap: 24px;
    grid-template-columns: 1fr 1fr;
    grid-template-areas: "title pick" "show pick" "start opts";
  }
  .title { font-size: clamp(1.8rem, 7vh, 2.6rem); }
  #bigPreview { width: min(180px, 30vw); }
}

/* ---------- in-game HUD ---------- */
#hud {
  position: fixed; left: 0; right: 0; top: 0; z-index: 3; pointer-events: none;
  padding-inline: 16px; padding-block: calc(env(safe-area-inset-top, 0px) + 12px) 0;
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
}
.icon-btn {
  pointer-events: auto; width: 46px; height: 46px; border-radius: 10px;
  background: var(--panel); border: 2px solid var(--line);
  display: grid; place-items: center;
}
.pause-icon { display: flex; gap: 5px; }
.pause-icon i { display: block; width: 6px; height: 18px; background: var(--ink); border-radius: 1px; }
.hud-score {
  font-family: var(--font-display); font-size: 1.15rem; font-variant-numeric: tabular-nums;
  display: flex; gap: 14px; color: #fff;
}
.hud-score .hi { color: #d5deeb; }
.hud-score .now.flash { color: var(--accent); }

#pad {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); z-index: 3;
  width: min(560px, 100%);
  padding-inline: 16px; padding-block: 0 calc(env(safe-area-inset-bottom, 0px) + 16px);
  display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
}
#pad button {
  font-family: var(--font-display); font-size: 1.05rem; color: #fff;
  background: rgba(13, 19, 34, 0.42); border: 2px solid rgba(255, 255, 255, 0.6); border-radius: 12px;
  padding-block: 20px; touch-action: none;
}
#pad button.on { background: rgba(255, 255, 255, 0.88); color: #11151d; }

/* ---------- dialogs ---------- */
.modal {
  position: fixed; inset: 0; z-index: 6; display: grid; place-items: center;
  padding-inline: 16px; background: rgba(8, 12, 24, 0.4);
}
.card {
  width: min(340px, 100%); background: var(--panel); border: 2px solid var(--line); border-radius: 14px;
  padding: 20px; display: grid; gap: 14px; text-align: center;
}
.card h2 { margin: 0; font-family: var(--font-display); font-size: 1.7rem; color: #fff; }
.card h2.hit { color: var(--accent); }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stat { display: grid; gap: 2px; padding: 10px 6px; border-radius: 8px; background: rgba(255, 255, 255, 0.06); }
.stat span { font-size: 0.72rem; color: var(--muted); letter-spacing: 0.06em; }
.stat b { font-family: var(--font-display); font-weight: 400; font-size: 1.3rem; font-variant-numeric: tabular-nums; }
.btn-main, .btn-ghost {
  font-family: var(--font-display); font-size: 1.05rem; border-radius: 10px; padding-block: 13px 11px;
}
.btn-main { color: var(--accent-ink); background: var(--accent); border: 0; box-shadow: 0 4px 0 var(--accent-deep); }
.btn-main:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--accent-deep); }
.btn-ghost { background: transparent; border: 2px solid var(--line); }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

@media (prefers-reduced-motion: reduce) {
  .title { transition: none; }
  .start:active, .btn-main:active { transform: none; }
}
</style>
</head>
<body>
<canvas id="cv" aria-label="Arena Robo Beat"></canvas>

<section id="menu" aria-label="Menu utama">
  <div class="menu-inner">
    <div class="brand">
      <h1 class="title">Robo<br>Beat</h1>
      <div class="best">REKOR <b id="menuHi">00000</b></div>
    </div>

    <div class="show">
      <button class="arrow" id="prevChar" type="button" aria-label="Karakter sebelumnya">&lt;</button>
      <div class="show-stage">

        <div class="hero-name outline" id="heroName">Beat</div>
        <div class="hero-tag" id="heroTag"></div>
      </div>
      <button class="arrow" id="nextChar" type="button" aria-label="Karakter berikutnya">&gt;</button>
    </div>

    <div class="pick">
      <div class="label">PILIH KARAKTER</div>
      <div class="chars" id="chars"></div>
    </div>

    <button class="start" id="btnStart" type="button">MULAI</button>

    <div class="opts">
      <button class="chip sound-toggle" id="btnSound" type="button" aria-pressed="true">Suara: On</button>

    </div>
  </div>
</section>

<div id="hud" hidden>
  <button class="icon-btn" id="btnPause" type="button" aria-label="Jeda">
    <span class="pause-icon"><i></i><i></i></span>
  </button>
  <div class="hud-score outline" aria-live="off">
    <span class="hi">HI <span id="hi">00000</span></span>
    <span class="now" id="now">00000</span>

</div>

<div id="pad" hidden>
  <button id="btnJump" type="button">LOMPAT</button>
  <button id="btnDuck" type="button">NUNDUK</button>
</div>

<div class="modal" id="pausePanel" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="pauseTitle">
    <h2 id="pauseTitle">Jeda</h2>
    <button class="btn-main" id="btnResume" type="button">Lanjut</button>
    <div class="row">
      <button class="btn-ghost sound-toggle" id="btnSound2" type="button" aria-pressed="true">Suara: On</button>
      <button class="btn-ghost" id="btnMenu1" type="button">Menu</button>
    </div>
  </div>
</div>

<div class="modal" id="overPanel" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="overTitle">
    <h2 id="overTitle" class="hit">Ketabrak!</h2>
    <div class="stats">
      <div class="stat"><span>SKOR</span><b id="finalScore">0</b></div>
      <div class="stat"><span>REKOR</span><b id="finalBest">0</b></div>
    </div>
    <button class="btn-main" id="btnRetry" type="button">Main lagi</button>
    <button class="btn-ghost" id="btnMenu2" type="button">Menu</button>
  </div>
</div>

<script>
(() => {
  const P = 2, WORLD_H = 150, GROUND = 128, HERO_X = 30;
  const G = 2300, JUMP_V = 580, CUT_V = 260;
  const CYCLE = 500;

  const SPR = {

    ],
    duckB: [

      "..eeewwwwwwwvvv.....",
      "..eeewwwwwwwvvv.....",

      ".....sss...sss......"
    ],
    box: [
      "dddddddddddd",
      "dbbbbttbbbbd",
      "dbbbbttbbbbd",
      "dddddddddddd",
      "dbbbbbbbbbbd",
      "dbdddbbbbbbd",
      "dbbbbbbbbbbd",
      "dbbbbbbbbbbd",
      "dbbbbbbbddbd",
      "dbbbbbbbbbbd",

    ],
    drum: [
      ".dddddddd.",
      "dbbbbbbbbd",
      "dbhbbbbbbd",
      "dddddddddd",
      "dbhbbbbbbd",
      "dbhbyyybbd",
      "dbhbyyybbd",
      "dbhbbbbbbd",
      "dddddddddd",
      "dbhbbbbbbd",

    ],
    crowUp: [
      "......#.......",
      ".....##.......",
      "....###.......",
      "..#######.....",

    ],
    crowDown: [

    ],
    cloud: [

    sun: [

    ]
  };
  SPR.dinoRunA = [

    "......b..gbbbbggggg.",
    ".....bb..gbooobgggg.",
    ".....bg..gboyobggggg",
    "....bbg..gbooobggggg",
    "....bgg..ggbbbbgdddd",
    "...bbggggggggggtttt.",
    "...bgggggggggggt.t.t",
    "..gggggggggggggggggg",
    ".wwggggggggGgggggg..",
    "gwwggggggggGggg.....",
    "g..gGGGGGGGGgg......",
    "....gg......gg......",
    "...kk........kk....."
  ];
  SPR.dinoRunB = SPR.dinoRunA.slice(0, 13).concat([
    "......gg..gg........",

  ]);
  SPR.dinoDuckA = [
    "....b.b.b....gggggg...",
    "...bgbgbgg..gbbbbgggg.",
    "..gggggggggggboybggggg",
    "wwggggggggggbbbbgdddd.",
    "wwgggggggGggggggtttt..",
    "g..gGGGGGGGggggggggggg",
    "....kk.......kk......."
  ];
  SPR.dinoDuckB = SPR.dinoDuckA.slice(0, 6).concat(["......kk..kk.........."]);

  const size = g => ({ w: Math.max(...g.map(r => r.length)) * P, h: g.length * P });

  /* ---------- playable characters ---------- */
  const ROBO_RUN = [SPR.runA, SPR.runB], ROBO_DUCK = [SPR.duckA, SPR.duckB];
  const CHARS = {
    beat: { name: 'Beat', tag: 'Visor pink, jaket oranye', hero: '#ff4f9a', run: ROBO_RUN, duck: ROBO_DUCK,
      colors: { c: '#2c2e36', e: '#e8edf2', w: '#b9c6d3', v: '#ff4f9a', o: '#f08a24', m: '#5b2a3c', n: '#f4f4f4', k: '#24252c', s: '#2f7de1' } },
    nova: { name: 'Nova', tag: 'Hoodie putih, visor tosca', hero: '#36f0c8', run: ROBO_RUN, duck: ROBO_DUCK,
      colors: { c: '#f3f3ef', e: '#2fb5a3', w: '#5f6772', v: '#36f0c8', o: '#e9e7e0', m: '#aeb8b4', n: '#ffffff', k: '#2a2c31', s: '#2fb5a3' } },
    rust: { name: 'Rust', tag: 'Topi oranye, jaket hitam', hero: '#ef7d22', run: ROBO_RUN, duck: ROBO_DUCK,
      colors: { c: '#ef7d22', e: '#f2913f', w: '#3a3c42', v: '#ffb43a', o: '#26272c', m: '#ef7d22', n: '#45464c', k: '#26272c', s: '#e8762a' } },
    glo: { name: 'Glo', tag: 'Serba ungu, headphone pink', hero: '#b77bff', run: ROBO_RUN, duck: ROBO_DUCK,
      colors: { c: '#6a3fd1', e: '#e19df0', w: '#c9c3e6', v: '#b77bff', o: '#d779e6', m: '#3b2a5c', n: '#f2c8f7', k: '#2a2340', s: '#9b5cf0' } },
    zee: { name: 'Zee', tag: 'Hijau stabilo, topi hitam', hero: '#b5e61d', run: ROBO_RUN, duck: ROBO_DUCK,
      colors: { c: '#26272c', e: '#b5e61d', w: '#8ea83a', v: '#cdf53a', o: '#b5e61d', m: '#2f3a1a', n: '#dcf57a', k: '#26272c', s: '#8fbf1a' } },
    dino: { name: 'Dino', tag: 'Kacamata bintang, ekor diperban', hero: '#86cf3a',
      run: [SPR.dinoRunA, SPR.dinoRunB], duck: [SPR.dinoDuckA, SPR.dinoDuckB],
      colors: { g: '#86cf3a', G: '#5fa82a', b: '#5b3b2e', o: '#f6a51c', y: '#5b3b2e', t: '#f6ecd4', w: '#efe3c8', k: '#4a3a33', d: '#3d2a22' } }
  };
  const CHAR_IDS = Object.keys(CHARS);
  let charId = 'beat';
  try { const saved = localStorage.getItem('roboBeatChar'); if (saved && CHARS[saved]) charId = saved; } catch (e) {}

  const $ = id => document.getElementById(id);
  const cv = $('cv'), ctx = cv.getContext('2d');
  const menu = $('menu'), hud = $('hud'), pad = $('pad');
  const pausePanel = $('pausePanel'), overPanel = $('overPanel');
  const nowEl = $('now'), hiEl = $('hi'), menuHi = $('menuHi');
  const btnJump = $('btnJump'), btnDuck = $('btnDuck');

  let worldW = 300, viewH = WORLD_H, offY = 0, scale = 1;

  const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  function mix(a, b, t) {
    const A = hex(a), B = hex(b);
    return 'rgb(' + A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',') + ')';
  }

  /* ---------- sound ---------- */
  let actx = null, soundOn = true;
  try { soundOn = localStorage.getItem('roboLariSound') !== 'off'; } catch (e) {}
  function syncSoundBtns() {
    document.querySelectorAll('.sound-toggle').forEach(b => {
      b.textContent = soundOn ? 'Suara: On' : 'Suara: Off';
      b.setAttribute('aria-pressed', soundOn ? 'true' : 'false');
    });
  }
  function ensureAudio() {
    if (!soundOn) return;
    if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; } }
    if (actx.state === 'suspended') actx.resume().catch(() => {});
  }
  function tone(f1, f2, dur, type = 'square', vol = 0.07, delay = 0) {
    if (!soundOn || !actx) return;
    const t = actx.currentTime + delay;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f1, t);
    o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t + dur + 0.03);
  }
  const sfx = {
    jump: () => tone(380, 900, 0.12, 'square', 0.06),
    point: () => { tone(988, 988, 0.08, 'square', 0.05); tone(1319, 1319, 0.16, 'square', 0.05, 0.08); },
    pick: () => tone(660, 990, 0.08, 'square', 0.05),
    start: () => { tone(523, 523, 0.1, 'square', 0.06); tone(659, 659, 0.1, 'square', 0.06, 0.1); tone(1047, 1047, 0.22, 'square', 0.06, 0.2); },
    hit: () => { tone(260, 50, 0.35, 'sawtooth', 0.1); tone(120, 40, 0.45, 'square', 0.07, 0.02); },
    night: () => { tone(784, 784, 0.18, 'triangle', 0.08); tone(659, 659, 0.18, 'triangle', 0.08, 0.16); tone(523, 523, 0.3, 'triangle', 0.08, 0.32); },
    day: () => { tone(523, 523, 0.18, 'triangle', 0.08); tone(659, 659, 0.18, 'triangle', 0.08, 0.16); tone(784, 784, 0.3, 'triangle', 0.08, 0.32); }
  };
  function toggleSound() {
    soundOn = !soundOn;
    try { localStorage.setItem('roboLariSound', soundOn ? 'on' : 'off'); } catch (e) {}
    syncSoundBtns();
    if (soundOn) { ensureAudio(); sfx.point(); }
  }

  /* ---------- world sizing: fill the screen, keep the play band readable ---------- */
  function resize() {
    const dpr = window.devicePixelRatio || 1;
    const w = cv.clientWidth || window.innerWidth, h = cv.clientHeight || window.innerHeight;
    scale = Math.min(h / (WORLD_H + 60), w / 225);
    worldW = w / scale;
    viewH = h / scale;
    offY = Math.max(0, viewH * 0.6 - GROUND);
    cv.width = Math.round(w * dpr);
    cv.height = Math.round(h * dpr);
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, Math.round(offY * scale * dpr));
    ctx.imageSmoothingEnabled = false;
    initScenery();
  }

  let hi = 0;
  try { hi = parseInt(localStorage.getItem('roboLariHi') || '0', 10) || 0; } catch (e) {}
  const pad5 = n => String(Math.floor(n)).padStart(5, '0');

  const S = {
    mode: 'menu', score: 0, speed: 230, nextGap: 0, t: 0,
    hero: { y: 0, vy: 0 },
    obs: [], clouds: [], pebbles: [], stars: [],
    jumpHeld: false, duckHeld: false, overAt: 0, lastHundred: 0,
    night: 0, nightTarget: 0, phase: 0
  };

  const skyTop = () => -offY;
  function cloudY() { const top = skyTop() * 0.7 + 10; return top + Math.random() * (60 - top); }
  function initScenery() {
    S.clouds = [];
    const nClouds = Math.max(4, Math.round(worldW / 70) + Math.round(offY / 60));
    for (let i = 0; i < nClouds; i++) S.clouds.push({ x: Math.random() * worldW, y: cloudY() });
    S.pebbles = [];
    const depth = Math.max(10, Math.min(80, viewH - offY - GROUND - 6));
    const nPeb = Math.round(worldW / 300 * 30 * Math.max(1, depth / 20));
    for (let i = 0; i < nPeb; i++) S.pebbles.push({ x: Math.random() * worldW, y: GROUND + 4 + Math.floor(Math.random() * depth), w: 1 + Math.floor(Math.random() * 3) });
    S.stars = [];
    for (let i = 0; i < 60; i++) S.stars.push({ x: Math.random() * 1200, y: skyTop() + 6 + Math.random() * (offY + 80), s: Math.random() < 0.2 ? 2 : 1, tw: Math.random() * 6 });
  }

  const DRUMS = ['#d23b2f', '#2f6fd6', '#2f9e5a', '#e0821f'];
  function makeObstacle(kind, x) {
    if (kind === 'box') return { kind, x, ...size(SPR.box), y: GROUND - 24 };
    if (kind === 'drum') return { kind, x, ...size(SPR.drum), y: GROUND - 26, paint: DRUMS[Math.floor(Math.random() * DRUMS.length)] };
    if (kind === 'box2') return { kind, x, w: 48, h: 24, y: GROUND - 24 };
    if (kind === 'stack') return { kind, x, w: 24, h: 48, y: GROUND - 48 };
    const bottom = kind === 'crowLow' ? GROUND - 2 : kind === 'crowMid' ? GROUND - 16 : GROUND - 40;
    return { kind: 'crow', x, w: 28, h: 14, y: bottom - 14 };
  }
  function spawn() {
    let kind;
    if (S.score > 250 && Math.random() < 0.28) {
      kind = ['crowLow', 'crowMid', 'crowMid', 'crowHigh'][Math.floor(Math.random() * 4)];
    } else {
      const pool = ['box', 'drum', 'drum'];
      if (S.score > 120) pool.push('box2');
      if (S.score > 450) pool.push('stack');
      kind = pool[Math.floor(Math.random() * pool.length)];
    }
    S.obs.push(makeObstacle(kind, worldW + 10));
    S.nextGap = S.speed * (0.62 + Math.random() * 0.85) + 70;
  }

  /* ---------- screens ---------- */
  function show(el, on) { el.hidden = !on; }
  function toMenu() {
    S.mode = 'menu';
    S.obs = []; S.hero.y = 0; S.hero.vy = 0; S.duckHeld = false;
    S.nightTarget = 0; S.phase = 0;
    show(menu, true); show(hud, false); show(pad, false); show(pausePanel, false); show(overPanel, false);
    menuHi.textContent = pad5(hi);
    refreshPicker();
  }
  function start() {
    ensureAudio();
    S.mode = 'run';
    S.score = 0; S.speed = 230; S.lastHundred = 0;
    S.phase = 0; S.nightTarget = 0;
    S.obs = [];
    S.nextGap = Math.max(160, worldW * 0.55);
    S.hero.y = 0; S.hero.vy = 0; S.duckHeld = false; S.jumpHeld = false;
    nowEl.textContent = pad5(0);
    hiEl.textContent = pad5(hi);
    show(menu, false); show(overPanel, false); show(pausePanel, false);
    show(hud, true); show(pad, true);
    sfx.start();
  }
  function pause() {
    if (S.mode !== 'run') return;
    S.mode = 'paused'; S.duckHeld = false;
    show(pad, false); show(pausePanel, true);
  }
  function resume() {
    if (S.mode !== 'paused') return;
    S.mode = 'run';
    show(pausePanel, false); show(pad, true);
  }
  function gameOver() {
    S.mode = 'over';
    S.overAt = performance.now();
    S.duckHeld = false;
    sfx.hit();
    if (navigator.vibrate) { try { navigator.vibrate(60); } catch (e) {} }
    const final = Math.floor(S.score);
    let newHi = false;
    if (final > hi) {
      hi = final; newHi = true;
      try { localStorage.setItem('roboLariHi', String(hi)); } catch (e) {}
    }
    hiEl.textContent = pad5(hi);
    $('overTitle').textContent = newHi ? 'Rekor baru!' : 'Ketabrak!';
    $('finalScore').textContent = final;
    $('finalBest').textContent = hi;
    show(pad, false);
    setTimeout(() => { if (S.mode === 'over') show(overPanel, true); }, 380);
  }

  /* ---------- hero control ---------- */
  function jump() {
    if (S.mode !== 'run') return;
    if (S.hero.y === 0 && !S.duckHeld) { S.hero.vy = JUMP_V; sfx.jump(); }
  }
  function jumpRelease() { if (S.hero.vy > CUT_V) S.hero.vy = CUT_V; }
  function press() { ensureAudio(); if (S.mode === 'run') { S.jumpHeld = true; jump(); } }
  function release() { S.jumpHeld = false; jumpRelease(); }

  function heroBox() {
    const ducking = S.duckHeld && S.hero.y === 0;
    const ch = CHARS[charId];
    if (ducking) { const dh = ch.duck[0].length * P; return { x: HERO_X + 8, y: GROUND - dh + 6, w: 26, h: dh - 7 }; }
    const h = ch.run[0].length * P;
    return { x: HERO_X + 8, y: GROUND - S.hero.y - h + 7, w: 20, h: h - 8 };
  }
  function hits(a, o) {
    const i = 3;
    return a.x < o.x + o.w - i && a.x + a.w > o.x + i && a.y < o.y + o.h - i && a.y + a.h > o.y + i;
  }

  /* ---------- update ---------- */
  function scrollScenery(dx) {
    for (const p of S.pebbles) if ((p.x -= dx) < -4) p.x += worldW + 8;
    for (const cl of S.clouds) if ((cl.x -= dx * 0.18) < -40) { cl.x = worldW + Math.random() * 60; cl.y = cloudY(); }
    for (const st of S.stars) if ((st.x -= dx * 0.04) < -4) st.x += 1200;
  }
  function update(dt) {
    S.t += dt;
    const step = dt / 1.4;
    if (S.night < S.nightTarget) S.night = Math.min(S.nightTarget, S.night + step);
    else if (S.night > S.nightTarget) S.night = Math.max(S.nightTarget, S.night - step);

    if (S.mode === 'menu') { scrollScenery(120 * dt); return; }
    if (S.mode !== 'run') return;

    S.speed = Math.min(560, 230 + S.score * 0.32);
    S.score += S.speed * dt * 0.045;

    const h = S.hero;
    if (h.y > 0 || h.vy > 0) {
      h.vy -= G * dt * (S.duckHeld ? 2.6 : 1);
      h.y += h.vy * dt;
      if (h.y <= 0) { h.y = 0; h.vy = 0; }
    }

    const dx = S.speed * dt;
    for (const o of S.obs) o.x -= o.kind === 'crow' ? dx * 1.08 : dx;
    S.obs = S.obs.filter(o => o.x + o.w > -10);
    S.nextGap -= dx;
    if (S.nextGap <= 0) spawn();
    scrollScenery(dx);

    const hb = heroBox();
    for (const o of S.obs) if (hits(hb, o)) { gameOver(); return; }

    const hundred = Math.floor(S.score / 100);
    if (hundred > S.lastHundred) {
      S.lastHundred = hundred;
      const phase = Math.floor(S.score / CYCLE) % 2;
      if (phase !== S.phase) { S.phase = phase; S.nightTarget = phase; phase ? sfx.night() : sfx.day(); }
      else sfx.point();
      nowEl.classList.add('flash');
      setTimeout(() => nowEl.classList.remove('flash'), 700);
    }
    nowEl.textContent = pad5(S.score);
  }

  /* ---------- drawing ---------- */
  function drawGrid(c, g, x, y, color, px = P) {
    c.fillStyle = color;
    const bx = Math.round(x), by = Math.round(y);
    for (let r = 0; r < g.length; r++) for (let col = 0; col < g[r].length; col++)
      if (g[r][col] === '#') c.fillRect(bx + col * px, by + r * px, px, px);
  }
  function drawSprite(c, g, x, y, map, px = P) {
    const bx = Math.round(x), by = Math.round(y);
    for (let r = 0; r < g.length; r++) for (let col = 0; col < g[r].length; col++) {
      const fill = map[g[r][col]];
      if (fill) { c.fillStyle = fill; c.fillRect(bx + col * px, by + r * px, px, px); }
    }
  }
  const DUSK = '#0f1a2b';
  const dim = (col, n) => n > 0 ? mix(col, DUSK, n * 0.4) : col;

  function draw() {
    const n = S.night, top = skyTop(), bottom = viewH - offY;

    const sky = ctx.createLinearGradient(0, top, 0, GROUND);
    sky.addColorStop(0, mix('#6fc0ff', '#050b17', n));
    sky.addColorStop(1, mix('#e8f6ff', '#1a2b47', n));
    ctx.fillStyle = sky;
    ctx.fillRect(0, top, worldW, GROUND - top);

    const orbTop = top * 0.55 + 70;
    const sunY = orbTop + n * 90, moonY = orbTop + 90 - n * 90;
    if (n < 1) { ctx.globalAlpha = 1 - n; drawGrid(ctx, SPR.sun, worldW * 0.68, sunY, '#ffc531'); }
    if (n > 0) {
      for (const st of S.stars) {
        ctx.globalAlpha = n * (0.55 + 0.45 * Math.sin(S.t * 2 + st.tw));
        ctx.fillStyle = '#f2f5ff';
        ctx.fillRect(Math.round(st.x % (worldW + 8)), Math.round(st.y), st.s, st.s);
      }
      ctx.globalAlpha = n;
      drawGrid(ctx, SPR.moon, worldW * 0.68, moonY, '#f4ecc2');
    }
    ctx.globalAlpha = 1;

    const cloudMap = { w: mix('#ffffff', '#3d4c69', n), s: mix('#cfe3f5', '#2b3852', n) };
    for (const cl of S.clouds) drawSprite(ctx, SPR.cloud, cl.x, cl.y, cloudMap);

    ctx.fillStyle = mix('#efe1bf', '#1a2333', n);
    ctx.fillRect(0, GROUND, worldW, bottom - GROUND);
    ctx.fillStyle = mix('#e2cd9f', '#151d2b', n);
    ctx.fillRect(0, GROUND + 22, worldW, bottom - GROUND - 22);
    ctx.fillStyle = mix('#7a5a35', '#5d6f8e', n);
    ctx.fillRect(0, GROUND, worldW, 1);
    ctx.fillStyle = mix('#c4a877', '#33435e', n);
    for (const p of S.pebbles) ctx.fillRect(Math.round(p.x), p.y, p.w, 1);

    const boxMap = { d: dim('#9a6634', n), b: dim('#d39a5a', n), t: dim('#f1dfae', n) };
    const crowMap = { '#': mix('#2b2d3a', '#0b0f18', n), y: dim('#ffb000', n) };
    for (const o of S.obs) {
      if (o.kind === 'box') drawSprite(ctx, SPR.box, o.x, o.y, boxMap);
      else if (o.kind === 'drum') drawSprite(ctx, SPR.drum, o.x, o.y, { b: dim(o.paint, n), d: dim('#2b2e35', n), h: dim('#e9edf2', n), y: dim('#f2c230', n) });
      else if (o.kind === 'box2') { drawSprite(ctx, SPR.box, o.x, o.y, boxMap); drawSprite(ctx, SPR.box, o.x + 24, o.y, boxMap); }
      else if (o.kind === 'stack') { drawSprite(ctx, SPR.box, o.x, o.y, boxMap); drawSprite(ctx, SPR.box, o.x, o.y + 24, boxMap); }
      else if (o.kind === 'crow') {
        const g = Math.floor(S.t * 6) % 2 ? SPR.crowUp : SPR.crowDown;
        if (n > 0.5) { ctx.globalAlpha = 0.5; drawGrid(ctx, g, o.x, o.y + 1, '#8fa3c7'); ctx.globalAlpha = 1; }
        drawSprite(ctx, g, o.x, o.y, crowMap);
      }
    }

    const moving = S.mode === 'run' || S.mode === 'menu';
    const ducking = S.duckHeld && S.hero.y === 0 && S.mode === 'run';
    const stepF = moving && S.hero.y === 0 ? Math.floor(S.t * 12) % 2 : 0;
    const ch = CHARS[charId];
    const g = ducking ? ch.duck[stepF] : ch.run[stepF];
    drawSprite(ctx, g, HERO_X, GROUND - (ducking ? 0 : S.hero.y) - g.length * P, ch.colors);
  }

  /* ---------- character picker (in the menu) ---------- */
  const charsEl = $('chars'), big = $('bigPreview');
  function drawPreview(cvs, ch, frame, px) {
    const c2 = cvs.getContext('2d');
    c2.imageSmoothingEnabled = false;
    const W = cvs.width, H = cvs.height, groundH = Math.round(H * 0.16);
    const sky = c2.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#6fc0ff'); sky.addColorStop(1, '#e8f6ff');
    c2.fillStyle = sky; c2.fillRect(0, 0, W, H);
    c2.fillStyle = '#efe1bf'; c2.fillRect(0, H - groundH, W, groundH);
    c2.fillStyle = '#7a5a35'; c2.fillRect(0, H - groundH, W, Math.max(1, px / 2));
    const grid = ch.run[frame];
    const w = Math.max(...grid.map(r => r.length)) * px, h = grid.length * px;
    drawSprite(c2, grid, (W - w) / 2, H - groundH - h, ch.colors, px);
  }
  function buildPicker() {
    charsEl.innerHTML = '';
    for (const id of CHAR_IDS) {
      const ch = CHARS[id];
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'char'; b.id = 'char-' + id; b.dataset.id = id;
      const cvs = document.createElement('canvas'); cvs.width = 96; cvs.height = 60;
      drawPreview(cvs, ch, 0, 2);
      const label = document.createElement('span'); label.textContent = ch.name;
      b.append(cvs, label);
      b.addEventListener('click', () => selectChar(id));
      charsEl.append(b);
    }
  }
  function refreshPicker() {
    const ch = CHARS[charId];
    charsEl.querySelectorAll('.char').forEach(el => el.setAttribute('aria-pressed', el.dataset.id === charId ? 'true' : 'false'));
    $('heroName').textContent = ch.name;
    $('heroTag').textContent = ch.tag;
    document.documentElement.style.setProperty('--hero', ch.hero);
    drawPreview(big, ch, 0, 6);
  }
  function selectChar(id) {
    if (!CHARS[id]) return;
    charId = id;
    try { localStorage.setItem('roboBeatChar', id); } catch (e) {}
    refreshPicker();
    ensureAudio(); sfx.pick();
  }
  function cycleChar(d) {
    const i = CHAR_IDS.indexOf(charId);
    selectChar(CHAR_IDS[(i + d + CHAR_IDS.length) % CHAR_IDS.length]);
  }

  /* ---------- loop ---------- */
  let last = performance.now(), lastBigFrame = -1;
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    if (S.mode === 'menu') {
      const f = Math.floor(S.t * 7) % 2;
      if (f !== lastBigFrame) { lastBigFrame = f; drawPreview(big, CHARS[charId], f, 6); }
    }
    requestAnimationFrame(loop);
  }

  /* ---------- input ---------- */
  cv.addEventListener('pointerdown', e => { e.preventDefault(); press(); });
  cv.addEventListener('pointerup', release);
  cv.addEventListener('pointercancel', release);
  cv.addEventListener('pointerleave', () => { if (S.jumpHeld) release(); });

  btnJump.addEventListener('pointerdown', e => { e.preventDefault(); btnJump.classList.add('on'); press(); });
  const jUp = () => { btnJump.classList.remove('on'); release(); };
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => btnJump.addEventListener(ev, jUp));
  btnDuck.addEventListener('pointerdown', e => { e.preventDefault(); btnDuck.classList.add('on'); ensureAudio(); S.duckHeld = true; });
  const dUp = () => { btnDuck.classList.remove('on'); S.duckHeld = false; };
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => btnDuck.addEventListener(ev, dUp));
  [btnJump, btnDuck, cv].forEach(b => b.addEventListener('contextmenu', e => e.preventDefault()));

  $('btnStart').addEventListener('click', start);
  $('btnRetry').addEventListener('click', start);
  $('btnResume').addEventListener('click', resume);
  $('btnPause').addEventListener('click', pause);
  $('btnMenu1').addEventListener('click', toMenu);
  $('btnMenu2').addEventListener('click', toMenu);
  $('prevChar').addEventListener('click', () => cycleChar(-1));
  $('nextChar').addEventListener('click', () => cycleChar(1));
  document.querySelectorAll('.sound-toggle').forEach(b => b.addEventListener('click', toggleSound));

  const JUMP_KEYS = ['Space', 'ArrowUp', 'KeyW'], DUCK_KEYS = ['ArrowDown', 'KeyS'];
  window.addEventListener('keydown', e => {
    if (e.code === 'KeyM' && !e.repeat) { toggleSound(); return; }
    if (S.mode === 'menu') {
      if (e.code === 'ArrowLeft') { e.preventDefault(); cycleChar(-1); }
      else if (e.code === 'ArrowRight') { e.preventDefault(); cycleChar(1); }
      else if (e.code === 'Space' && !e.repeat) { e.preventDefault(); start(); }
      return;
    }
    if (S.mode === 'run') {
      if (JUMP_KEYS.includes(e.code)) { e.preventDefault(); if (!e.repeat) press(); }
      else if (DUCK_KEYS.includes(e.code)) { e.preventDefault(); ensureAudio(); S.duckHeld = true; }
      else if ((e.code === 'Escape' || e.code === 'KeyP') && !e.repeat) pause();
      return;
    }
    if (S.mode === 'paused' && (e.code === 'Escape' || e.code === 'KeyP') && !e.repeat) { resume(); return; }
    if (S.mode === 'over' && e.code === 'Space' && !e.repeat && performance.now() - S.overAt > 450) { e.preventDefault(); start(); }
  });
  window.addEventListener('keyup', e => {
    if (JUMP_KEYS.includes(e.code)) release();
    else if (DUCK_KEYS.includes(e.code)) S.duckHeld = false;
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

  /* ---------- boot ---------- */
  new ResizeObserver(() => resize()).observe(cv);
  resize();
  buildPicker();
  syncSoundBtns();
  toMenu();
  draw();
  requestAnimationFrame(t => { last = t; loop(t); });
})();
</script>
</body>
</html>
