<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Robo Beat: game lari tanpa henti. Pilih karakter dan grafis 240p atau 1080p, lompati kardus dan drum oli, hindari gagak.">
<meta name="theme-color" content="#0f1a2b">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }
img { max-width: 100%; }
</style>
<title>Robo Beat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-screen arcade. The pixel world fills the screen; menu, HUD, pad and dialogs float on top. */
:root {
  --night: #0f1a2b;
  --ink: #f4f7fb;
  --muted: #a9b6cc;
  --panel: rgba(13, 19, 34, 0.84);
  --line: rgba(255, 255, 255, 0.2);
  --accent: #ffb21f;
  --accent-deep: #c97c00;
  --accent-ink: #231603;
  --hero: #ff4f9a;
  --font-display: "Silkscreen", ui-monospace, "Courier New", monospace;
  --font-body: "IBM Plex Mono", ui-monospace, "Courier New", monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; background: var(--night); color: var(--ink);
  font-family: var(--font-body);
  user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.outline {
  text-shadow: 2px 0 #11151d, -2px 0 #11151d, 0 2px #11151d, 0 -2px #11151d,
               2px 2px #11151d, -2px -2px #11151d, 2px -2px #11151d, -2px 2px #11151d;
}

#cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

/* ---------- menu ---------- */
#menu {
  position: fixed; inset: 0; overflow-y: auto; z-index: 5;
  background: linear-gradient(180deg, rgba(8, 12, 24, 0.5), rgba(8, 12, 24, 0.82));
  padding-inline: 16px;
  padding-block: calc(env(safe-area-inset-top, 0px) + 22px) calc(env(safe-area-inset-bottom, 0px) + 22px);
  display: flex;
}
.menu-inner {
  width: min(460px, 100%); margin: auto;
  display: grid; gap: 16px;
  grid-template-areas: "title" "show" "pick" "res" "start" "opts";
}
.brand { grid-area: title; text-align: center; display: grid; gap: 8px; }
.title {
  margin: 0; font-family: var(--font-display); font-weight: 700;
  font-size: clamp(2.3rem, 12vw, 3.6rem); line-height: 0.95; letter-spacing: 0.04em; color: #fff;
  text-shadow: 3px 3px 0 var(--hero), 6px 6px 0 #11151d;
  transition: text-shadow 0.25s;
}
.best { font-family: var(--font-display); font-size: 0.95rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.best b { color: var(--ink); font-weight: 400; }

.show {
  grid-area: show; display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 8px;
}
.show-stage { display: grid; justify-items: center; gap: 6px; }
#bigPreview { width: min(220px, 60vw); aspect-ratio: 2 / 1; image-rendering: pixelated; max-width: 100%; }
.hero-name { font-family: var(--font-display); font-size: 1.5rem; letter-spacing: 0.05em; }
.hero-tag { font-size: 0.8rem; color: var(--muted); text-align: center; min-height: 1.2em; }
.arrow {
  height: 44px; border-radius: 8px; background: var(--panel); border: 2px solid var(--line);
  font-family: var(--font-display); font-size: 1.1rem;
}

.pick { grid-area: pick; display: grid; gap: 8px; }
.label { font-family: var(--font-display); font-size: 0.8rem; color: var(--muted); letter-spacing: 0.08em; }
.chars { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.char {
  display: grid; justify-items: center; gap: 4px; padding: 8px 6px 6px;
  background: var(--panel); border: 2px solid var(--line); border-radius: 8px;
  font-family: var(--font-display); font-size: 0.78rem;
}
.char canvas { width: 100%; max-width: 96px; aspect-ratio: 8 / 5; image-rendering: pixelated; }
.char[aria-pressed="true"] { border-color: var(--accent); background: rgba(255, 178, 31, 0.14); color: var(--accent); }

.res { grid-area: res; display: grid; gap: 8px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seg-btn {
  display: grid; gap: 2px; padding: 10px 8px; text-align: center;
  background: var(--panel); border: 2px solid var(--line); border-radius: 8px;
}
.seg-btn b { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; }
.seg-btn span { font-size: 0.72rem; color: var(--muted); }
.seg-btn[aria-pressed="true"] { border-color: var(--accent); background: rgba(255, 178, 31, 0.14); }
.seg-btn[aria-pressed="true"] b { color: var(--accent); }
body.hd .char canvas, body.hd #bigPreview { image-rendering: auto; }
.start {
  grid-area: start;
  font-family: var(--font-display); font-weight: 700; font-size: 1.45rem; letter-spacing: 0.08em;
  color: var(--accent-ink); background: var(--accent);
  border: 0; border-radius: 10px; padding-block: 16px 12px;
  box-shadow: 0 5px 0 var(--accent-deep);
}
.start:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--accent-deep); }
.opts { grid-area: opts; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
.chip {
  font-family: var(--font-display); font-size: 0.8rem; padding: 8px 12px;
  background: transparent; border: 2px solid var(--line); border-radius: 6px;
}
.keys { font-size: 0.75rem; color: var(--muted); text-align: center; line-height: 1.6; }

@media (orientation: landscape) and (max-height: 560px) {
  .menu-inner {
    width: min(860px, 100%); column-gap: 24px;
    grid-template-columns: 1fr 1fr;
    grid-template-areas: "title pick" "show pick" "show res" "start opts";
  }
  .title { font-size: clamp(1.8rem, 7vh, 2.6rem); }
  #bigPreview { width: min(180px, 30vw); }
}

/* ---------- in-game HUD ---------- */
#hud {
  position: fixed; left: 0; right: 0; top: 0; z-index: 3; pointer-events: none;
  padding-inline: 16px; padding-block: calc(env(safe-area-inset-top, 0px) + 12px) 0;
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
}
.icon-btn {
  pointer-events: auto; width: 46px; height: 46px; border-radius: 10px;
  background: var(--panel); border: 2px solid var(--line);
  display: grid; place-items: center;
}
.pause-icon { display: flex; gap: 5px; }
.pause-icon i { display: block; width: 6px; height: 18px; background: var(--ink); border-radius: 1px; }
.hud-score {
  font-family: var(--font-display); font-size: 1.15rem; font-variant-numeric: tabular-nums;
  display: flex; gap: 14px; color: #fff;
}
.hud-score .hi { color: #d5deeb; }
.hud-score .now.flash { color: var(--accent); }

#pad {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); z-index: 3;
  width: min(560px, 100%);
  padding-inline: 16px; padding-block: 0 calc(env(safe-area-inset-bottom, 0px) + 16px);
  display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
}
#pad button {
  font-family: var(--font-display); font-size: 1.05rem; color: #fff;
  background: rgba(13, 19, 34, 0.42); border: 2px solid rgba(255, 255, 255, 0.6); border-radius: 12px;
  padding-block: 20px; touch-action: none;
}
#pad button.on { background: rgba(255, 255, 255, 0.88); color: #11151d; }

/* ---------- dialogs ---------- */
.modal {
  position: fixed; inset: 0; z-index: 6; display: grid; place-items: center;
  padding-inline: 16px; background: rgba(8, 12, 24, 0.4);
}
.card {
  width: min(340px, 100%); background: var(--panel); border: 2px solid var(--line); border-radius: 14px;
  padding: 20px; display: grid; gap: 14px; text-align: center;
}
.card h2 { margin: 0; font-family: var(--font-display); font-size: 1.7rem; color: #fff; }
.card h2.hit { color: var(--accent); }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stat { display: grid; gap: 2px; padding: 10px 6px; border-radius: 8px; background: rgba(255, 255, 255, 0.06); }
.stat span { font-size: 0.72rem; color: var(--muted); letter-spacing: 0.06em; }
.stat b { font-family: var(--font-display); font-weight: 400; font-size: 1.3rem; font-variant-numeric: tabular-nums; }
.btn-main, .btn-ghost {
  font-family: var(--font-display); font-size: 1.05rem; border-radius: 10px; padding-block: 13px 11px;
}
.btn-main { color: var(--accent-ink); background: var(--accent); border: 0; box-shadow: 0 4px 0 var(--accent-deep); }
.btn-main:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--accent-deep); }
.btn-ghost { background: transparent; border: 2px solid var(--line); }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

@media (prefers-reduced-motion: reduce) {
  .title { transition: none; }
  .start:active, .btn-main:active { transform: none; }
}
</style>
</head>

<canvas id="cv" aria-label="Arena Robo Beat"></canvas>

    <div class="opts">

<div id="pad" hidden>

<div class="modal" id="pausePanel" hidden>

  /* ---------- world sizing: fill the screen, keep the play band readable ---------- */

  const skyTop = () => -offY;

  function initScenery() {
    S.clouds = [];

    for (let i = 0; i < nClouds; i++) S.clouds.push({ x: Math.random() * worldW, y: cloudY() });
    S.pebbles = [];

  }

  const DRUMS = ['#d23b2f', '#2f6fd6', '#2f9e5a', '#e0821f'];
  function makeObstacle(kind, x) {

    if (kind === 'drum') return { kind, x, ...size(SPR.drum), y: GROUND - 26, paint: DRUMS[Math.floor(Math.random() * DRUMS.length)] };
    if (kind === 'box2') return { kind, x, w: 48, h: 24, y: GROUND - 24 };

  }
  function spawn() {
    let kind;

    } else {
      const pool = ['box', 'drum', 'drum'];

  /* ---------- screens ---------- */

  /* ---------- hero control ---------- */

  function heroBox() {

  /* ---------- update ---------- */

    if (S.mode === 'menu') { scrollScenery(120 * dt); return; }

  /* ---------- drawing ---------- */
  function drawGrid(c, g, x, y, color, px = P) {
    c.fillStyle = color;

  /* ---------- 1080p renderer: smooth vector art drawn in world units ---------- */

  // Robot crew: origin at the feet, facing right. Design height is about 54 units.
  function roboHD(c, k, ph, pose) {
    const run = pose === 'run', air = pose === 'air';
    const sw = run ? Math.sin(ph) : 0;
    const hy = -12 + (run ? -Math.abs(Math.cos(ph)) * 1.2 : 0);
    const aF = air ? 0.8 : run ? 0.6 * sw : 0.12;
    const aB = air ? -0.45 : run ? -0.6 * sw : -0.12;
    const leg = (hx, a, pants) => {
      const ax = hx + Math.sin(a) * 8.5, ay = hy + Math.cos(a) * 8.5;
      limb(c, hx, hy, ax, ay, 4.6, pants);
      rrp(c, ax - 3.4, ay - 1.6, 9, 4.6, 2.2); fs(c, k.shoe);
      c.fillStyle = k.sole; c.fillRect(ax - 2.6, ay + 1.5, 7.4, 1.1);
      c.fillStyle = 'rgba(255,255,255,0.8)'; c.fillRect(ax + 0.6, ay - 0.7, 2.2, 0.8);
    };
    leg(-2, aB, shade(k.pants, -0.3));
    if (k.pack) {
      rrp(c, -16.5, hy - 14, 9.5, 14, 3.5); fs(c, k.pack);
      rrp(c, -15.5, hy - 7.5, 7.5, 5.5, 2); fs(c, shade(k.pack, -0.22), 1);
    }
    rrp(c, -9.5, hy - 12, 19, 14, 5.5); fs(c, k.jacket);
    c.strokeStyle = shade(k.jacket, lum(k.jacket) < 70 ? 0.18 : -0.25); c.lineWidth = 0.9;
    c.beginPath();
    c.moveTo(-7.5, hy - 7.5); c.quadraticCurveTo(0, hy - 6.4, 7.5, hy - 7.5);
    c.moveTo(-7.5, hy - 3.6); c.quadraticCurveTo(0, hy - 2.5, 7.5, hy - 3.6);
    c.stroke();
    if (k.stripe) { c.fillStyle = k.stripe; c.fillRect(-1, hy - 11, 1.6, 10); }
    rrp(c, -9.5, hy - 1, 19, 3.4, 1.7); fs(c, k.trim, 1.1);
    leg(1.5, aF, k.pants);
    rrp(c, -8.5, hy - 16, 17, 6.5, 3.2); fs(c, k.collar);

    const top = hy - 34;
    limb(c, -11, top + 5, -11, top - 5, 1.4, k.phone);
    disc(c, -11, top - 5.6, 1.7); fs(c, k.phone, 1);
    const sg = c.createLinearGradient(0, top, 0, top + 20);
    sg.addColorStop(0, shade(k.shell, 0.28)); sg.addColorStop(1, shade(k.shell, -0.14));
    rrp(c, -11, top + 1, 24, 19, 7); fs(c, sg);
    const vg = c.createLinearGradient(0, top + 4, 0, top + 18);
    vg.addColorStop(0, shade(k.visor, 0.4)); vg.addColorStop(1, k.visorDeep);
    rrp(c, 2, top + 4.5, 12.5, 14, 5); fs(c, vg, 1.2);
    c.fillStyle = 'rgba(255,255,255,0.55)'; rrp(c, 3.6, top + 6, 2.3, 6.5, 1.15); c.fill();
    c.fillStyle = k.eye;
    rrp(c, 7.2, top + 9, 1.5, 3.3, 0.75); c.fill();
    rrp(c, 11.2, top + 9, 1.5, 3.3, 0.75); c.fill();
    c.strokeStyle = k.eye; c.lineWidth = 1; c.lineCap = 'round';
    c.beginPath(); c.arc(9.8, top + 13.2, 1.8, 0.2 * Math.PI, 0.8 * Math.PI); c.stroke();
    rrp(c, -15.5, top + 5, 9.5, 13, 3.5); fs(c, k.phone);
    rrp(c, -14, top + 7, 6.5, 9, 2.5); fs(c, shade(k.phone, -0.18), 0.9);
    c.fillStyle = 'rgba(255,255,255,0.35)'; rrp(c, -13.2, top + 7.8, 1.6, 4.5, 0.8); c.fill();

    c.beginPath(); c.moveTo(-12.5, top + 7.5);
    c.bezierCurveTo(-13.5, top - 4, -4, top - 7, 3, top - 7);
    c.bezierCurveTo(11, top - 7, 15, top - 2, 15, top + 6);
    c.closePath(); fs(c, k.cap);
    c.strokeStyle = lum(k.cap) < 80 ? 'rgba(255,255,255,0.22)' : 'rgba(0,0,0,0.2)'; c.lineWidth = 0.9;
    c.beginPath(); c.moveTo(2.5, top - 7); c.quadraticCurveTo(0.5, top, 1.5, top + 6.5); c.stroke();
    c.beginPath(); c.moveTo(8.5, top + 3.5); c.quadraticCurveTo(21, top + 2, 27, top + 6.8);
    c.quadraticCurveTo(19, top + 8.8, 8.5, top + 7.6); c.closePath(); fs(c, k.brim);
    disc(c, 2.6, top - 7, 1.2); fs(c, k.cap, 0.9);

    const armA = air ? 2.5 : run ? -0.75 * sw : 0.2;
    const sx = 2.5, sy = hy - 10;
    const px = sx + Math.sin(armA) * 7.5, py = sy + Math.cos(armA) * 7.5;
    limb(c, sx, sy, px, py, 5, k.sleeve);
    disc(c, px, py, 2.7); fs(c, shade(k.sleeve, 0.15), 1.1);
  }

  // Dino: blocky green rex with a star goggle. Origin at the feet, facing right.
  function dinoHD(c, ph, pose) {
    const run = pose === 'run', air = pose === 'air';
    const sw = run ? Math.sin(ph) : 0;
    const by = run ? -Math.abs(Math.cos(ph)) * 1.0 : 0;
    const G = '#8ad13c', GD = '#5c9e28', GL = '#b9ee72', B = '#5e3d2f', TOOTH = '#f7efdc', BAND = '#efe4cc';
    // tail
    c.beginPath(); c.moveTo(-9, by - 18);
    c.quadraticCurveTo(-20, by - 15, -27, by - 7 + sw);
    c.lineTo(-25, by - 4 + sw);
    c.quadraticCurveTo(-18, by - 8, -9, by - 8);
    c.closePath(); fs(c, G);
    c.beginPath(); c.moveTo(-23.5, by - 8 + sw); c.lineTo(-27.5, by - 13 + sw); c.lineTo(-21.5, by - 9.5 + sw); c.closePath(); fs(c, B, 1);
    c.save(); c.translate(-16.5, by - 11.5); c.rotate(0.5);
    rrp(c, -2.2, -4.5, 4.4, 8, 1); fs(c, BAND, 1);
    c.strokeStyle = 'rgba(120,95,60,0.6)'; c.lineWidth = 0.6;
    c.beginPath(); c.moveTo(-2, -1.5); c.lineTo(2, -1.5); c.moveTo(-2, 1.5); c.lineTo(2, 1.5); c.stroke();
    c.restore();
    // back leg
    const liftB = run ? Math.max(0, -sw) * 2.4 : air ? 1.5 : 0;
    const liftF = run ? Math.max(0, sw) * 2.4 : air ? 2.5 : 0;
    rrp(c, -8.5, by - 8 - liftB, 7.5, 8, 2.2); fs(c, GD);
    for (let i = 0; i < 2; i++) { c.beginPath(); c.moveTo(-4 + i * 2.4, by - liftB); c.lineTo(-2.6 + i * 2.4, by + 1.4 - liftB); c.lineTo(-1.6 + i * 2.4, by - liftB); c.closePath(); fs(c, B, 0.7); }
    // body
    rrp(c, -11, by - 25, 21, 19, 6); fs(c, G);
    c.fillStyle = GL; rrp(c, -1, by - 20, 10, 13, 5); c.fill();
    c.strokeStyle = GD; c.lineWidth = 0.8;
    c.beginPath(); c.moveTo(-8, by - 21); c.lineTo(-5, by - 18); c.lineTo(-7, by - 14); c.moveTo(-9, by - 11); c.lineTo(-6, by - 10); c.stroke();
    // back plate
    c.beginPath(); c.moveTo(-9, by - 38); c.lineTo(-16.5, by - 28); c.lineTo(-9, by - 19); c.closePath(); fs(c, B);
    disc(c, -12.2, by - 28, 1.7); fs(c, '#f6a51c', 0.8);
    // front leg
    rrp(c, 1, by - 8 - liftF, 8.5, 8, 2.2); fs(c, G);
    for (let i = 0; i < 3; i++) { c.beginPath(); c.moveTo(3 + i * 2.3, by - liftF); c.lineTo(4.4 + i * 2.3, by + 1.4 - liftF); c.lineTo(5.3 + i * 2.3, by - liftF); c.closePath(); fs(c, B, 0.7); }
    // shoulder badge
    disc(c, -3.5, by - 16, 3.1); fs(c, '#f4ead5', 1);
    c.fillStyle = '#f6a51c'; star(c, -3.5, by - 16, 2.1); c.fill();
    // crest
    c.beginPath(); c.moveTo(3, by - 49); c.lineTo(9, by - 56); c.lineTo(14, by - 49); c.closePath(); fs(c, G);
    // lower jaw + teeth
    rrp(c, -8, by - 31, 29, 8, 3); fs(c, G);
    for (let x = 4; x < 20; x += 3.6) { c.beginPath(); c.moveTo(x, by - 30.5); c.lineTo(x + 1.8, by - 33.3); c.lineTo(x + 3.6, by - 30.5); c.closePath(); fs(c, TOOTH, 0.6); }
    // upper head
    rrp(c, -10, by - 50, 33, 18.5, 5); fs(c, G);
    for (let x = 2.3; x < 21; x += 3.6) { c.beginPath(); c.moveTo(x, by - 31.8); c.lineTo(x + 1.8, by - 28.6); c.lineTo(x + 3.6, by - 31.8); c.closePath(); fs(c, TOOTH, 0.6); }
    c.strokeStyle = GD; c.lineWidth = 0.8;
    c.beginPath(); c.moveTo(-6, by - 46); c.lineTo(-3, by - 43); c.moveTo(14, by - 37); c.lineTo(17, by - 39); c.lineTo(19, by - 36); c.stroke();
    c.strokeStyle = OL; c.lineWidth = 1; c.beginPath(); c.moveTo(19.5, by - 47); c.lineTo(21, by - 46); c.stroke();
    // goggle
    rrp(c, -10, by - 45, 15, 3.4, 1.6); fs(c, B, 1);
    disc(c, 8, by - 42, 6.2); fs(c, B);
    const lg = c.createRadialGradient(6.5, by - 44, 0.5, 8, by - 42, 4.8);
    lg.addColorStop(0, '#ffe08a'); lg.addColorStop(1, '#f29a12');
    disc(c, 8, by - 42, 4.6); fs(c, lg, 0.9);
    c.fillStyle = '#6a4434'; star(c, 8, by - 41.8, 2.6); c.fill();
    c.strokeStyle = 'rgba(255,255,255,0.7)'; c.lineWidth = 0.8;
    c.beginPath(); c.arc(8, by - 42, 3.4, 3.6, 4.4); c.stroke();
    // small arm with bandage
    const armY = run ? sw * 0.8 : 0;
    limb(c, 5, by - 20, 10.5, by - 16 + armY, 2.6, G);
    c.save(); c.translate(8.6, by - 17.3 + armY / 2); c.rotate(0.6);
    rrp(c, -1, -1.9, 2, 3.8, 0.6); fs(c, BAND, 0.6); c.restore();
  }

  function drawHeroVector(c, ch, cx, by, pose, ph, s) {
    c.save(); c.translate(cx, by);
    if (pose === 'duck') c.scale(s * 1.18, s * 0.52); else c.scale(s, s);
    c.lineJoin = 'round';
    const p = pose === 'duck' ? 'run' : pose;
    if (ch.hd === 'dino') dinoHD(c, ph, p); else roboHD(c, ch.hd, ph, p);
    c.restore();
  }
  const HERO_HD_SCALE = 0.58;
  const heroCenterOffset = ch => (ch.hd === 'dino' ? -2 : 5.5);

  function boxHD(c, x, y, n) {
    const w = 24, h = 24;
    const g = c.createLinearGradient(x, 0, x + w, 0);
    g.addColorStop(0, dim('#e3ac6c', n)); g.addColorStop(1, dim('#b4783c', n));
    rrp(c, x + 0.6, y + 0.6, w - 1.2, h - 1.2, 1.6); fs(c, g, 1.2);
    c.strokeStyle = dim('#87572a', n); c.lineWidth = 0.9;
    c.beginPath(); c.moveTo(x + 1.5, y + 5.5); c.lineTo(x + w - 1.5, y + 5.5); c.stroke();
    c.fillStyle = dim('#f3e2b3', n); c.fillRect(x + w / 2 - 2.3, y + 1.2, 4.6, 9.5);
    c.strokeStyle = dim('#6e4219', n); c.lineWidth = 1; c.lineCap = 'round';
    for (const ax of [x + 5, x + 9]) { c.beginPath(); c.moveTo(ax, y + 19); c.lineTo(ax, y + 13.5); c.moveTo(ax - 1.6, y + 15.2); c.lineTo(ax, y + 13.5); c.lineTo(ax + 1.6, y + 15.2); c.stroke(); }
    c.fillStyle = 'rgba(0,0,0,0.12)'; c.fillRect(x + w - 5, y + 6, 3.8, h - 7.4);
  }
  function drumHD(c, x, y, paint, n) {
    const w = 20, h = 26, p = dim(paint, n);
    const g = c.createLinearGradient(x, 0, x + w, 0);
    g.addColorStop(0, shade(p, -0.45)); g.addColorStop(0.28, shade(p, 0.18));
    g.addColorStop(0.55, p); g.addColorStop(1, shade(p, -0.5));
    rrp(c, x + 0.6, y + 2.2, w - 1.2, h - 3.4, 2); fs(c, g, 1.2);
    for (const fy of [0.37, 0.69]) {
      const ry = y + h * fy;
      c.beginPath(); c.ellipse(x + w / 2, ry, w / 2 - 0.6, 1.5, 0, 0, Math.PI);
      c.strokeStyle = OL; c.lineWidth = 1.1; c.stroke();
      c.beginPath(); c.ellipse(x + w / 2, ry - 0.9, w / 2 - 1.4, 1.2, 0, 0.15 * Math.PI, 0.85 * Math.PI);
      c.strokeStyle = 'rgba(255,255,255,0.35)'; c.lineWidth = 0.7; c.stroke();
    }
    c.beginPath(); c.ellipse(x + w / 2, y + 2.6, w / 2 - 0.6, 2.3, 0, 0, Math.PI * 2); fs(c, shade(p, 0.15), 1.1);
    c.beginPath(); c.ellipse(x + w * 0.7, y + 2.5, 1.5, 0.75, 0, 0, Math.PI * 2); c.fillStyle = OL; c.fill();
    rrp(c, x + w * 0.27, y + h * 0.44, w * 0.46, h * 0.2, 1); fs(c, dim('#f2c230', n), 0.8);
    c.beginPath(); const dx = x + w / 2, dy = y + h * 0.54;
    c.moveTo(dx, dy - 2); c.quadraticCurveTo(dx + 1.6, dy + 0.3, dx, dy + 1.4); c.quadraticCurveTo(dx - 1.6, dy + 0.3, dx, dy - 2);
    c.fillStyle = OL; c.fill();
  }
  function crowHD(c, x, y, t, n) {
    const body = mix('#2b2d3a', '#0b0f18', n), wing = mix('#3d4052', '#151a26', n);
    const flap = Math.sin(t * 12);
    c.beginPath(); c.moveTo(x + 6, y + 8); c.lineTo(x + 0.5, y + 6); c.lineTo(x + 1.5, y + 11); c.closePath(); fs(c, body, 1);
    c.beginPath(); c.ellipse(x + 13.5, y + 9, 9, 4.6, 0, 0, Math.PI * 2); fs(c, body, 1.1);
    disc(c, x + 22, y + 6.5, 3.7); fs(c, body, 1.1);
    c.beginPath(); c.moveTo(x + 25, y + 5.6); c.lineTo(x + 29.5, y + 7.2); c.lineTo(x + 25, y + 8.4); c.closePath(); fs(c, dim('#ffb000', n), 0.8);
    disc(c, x + 23, y + 5.6, 1); c.fillStyle = '#ffffff'; c.fill();
    disc(c, x + 23.3, y + 5.6, 0.5); c.fillStyle = OL; c.fill();
    c.beginPath(); c.moveTo(x + 9, y + 7.5); c.quadraticCurveTo(x + 7, y + 7.5 - flap * 9, x + 3.5, y + 7.5 - flap * 10.5);
    c.quadraticCurveTo(x + 12, y + 7.5 - flap * 6, x + 17, y + 7.5); c.closePath(); fs(c, wing, 1);
    if (n > 0.5) { c.globalAlpha = 0.35; c.strokeStyle = '#8fa3c7'; c.lineWidth = 0.8; c.beginPath(); c.ellipse(x + 13.5, y + 9, 9.6, 5.2, 0, 0, Math.PI * 2); c.stroke(); c.globalAlpha = 1; }
  }
  function cloudHD(c, x, y, n) {
    c.fillStyle = mix('#ffffff', '#3d4c69', n);
    c.beginPath();
    c.arc(x + 9, y + 4, 5, 0, Math.PI * 2); c.arc(x + 16, y + 1, 7.5, 0, Math.PI * 2); c.arc(x + 24, y + 4.5, 5, 0, Math.PI * 2);
    c.fill();
    rrp(c, x + 4, y + 3.5, 25, 5.5, 2.75); c.fill();
    c.fillStyle = mix('#dcebf8', '#2b3852', n); rrp(c, x + 6, y + 7, 21, 2, 1); c.fill();
  }
  function hills(c, off, base, amp, color) {
    c.fillStyle = color; c.beginPath(); c.moveTo(0, GROUND);
    for (let x = 0; x <= worldW + 6; x += 6) {
      const u = x + off;
      c.lineTo(x, base - amp * (0.6 * Math.sin(u / 38) + 0.4 * Math.sin(u / 17 + 1.7) + 0.6));
    }
    c.lineTo(worldW, GROUND); c.closePath(); c.fill();
  }

  function drawHD() {
    const c = ctx, n = S.night, top = skyTop(), bottom = viewH - offY;
    const sky = c.createLinearGradient(0, top, 0, GROUND);
    sky.addColorStop(0, mix('#5fb6ff', '#050b17', n));
    sky.addColorStop(1, mix('#e9f7ff', '#1d2e4c', n));
    c.fillStyle = sky; c.fillRect(0, top, worldW, GROUND - top);

    const orbTop = top * 0.55 + 70, ox = worldW * 0.68;
    if (n < 1) {
      const sy = orbTop + n * 90;
      c.globalAlpha = 1 - n;
      const rg = c.createRadialGradient(ox, sy, 3, ox, sy, 30);
      rg.addColorStop(0, 'rgba(255,214,90,0.6)'); rg.addColorStop(1, 'rgba(255,214,90,0)');
      c.fillStyle = rg; disc(c, ox, sy, 30); c.fill();
      c.fillStyle = '#ffd65a'; disc(c, ox, sy, 8); c.fill();
      c.fillStyle = '#fff1b8'; disc(c, ox - 2, sy - 2, 3.5); c.fill();
    }
    if (n > 0) {
      for (const st of S.stars) {
        c.globalAlpha = n * (0.55 + 0.45 * Math.sin(S.t * 2 + st.tw));
        c.fillStyle = '#f2f5ff'; disc(c, st.x % (worldW + 8), st.y, st.s * 0.6); c.fill();
      }
      const my = orbTop + 90 - n * 90;
      c.globalAlpha = n;
      const mg = c.createRadialGradient(ox, my, 3, ox, my, 26);
      mg.addColorStop(0, 'rgba(244,236,194,0.45)'); mg.addColorStop(1, 'rgba(244,236,194,0)');
      c.fillStyle = mg; disc(c, ox, my, 26); c.fill();
      c.fillStyle = '#f4ecc2'; disc(c, ox, my, 7.5); c.fill();
      c.fillStyle = 'rgba(180,170,130,0.5)'; disc(c, ox - 2.5, my - 1.5, 1.6); c.fill(); disc(c, ox + 2.2, my + 2.4, 1.2); c.fill();
    }
    c.globalAlpha = 1;

    hills(c, S.hillA, GROUND - 16, 9, mix('#a7d3ee', '#18263e', n));
    for (const cl of S.clouds) cloudHD(c, cl.x, cl.y, n);
    hills(c, S.hillB, GROUND - 4, 6, mix('#9fd27f', '#152536', n));

    const gg = c.createLinearGradient(0, GROUND, 0, Math.max(GROUND + 30, bottom));
    gg.addColorStop(0, mix('#f3e4c0', '#1c2638', n)); gg.addColorStop(1, mix('#d6bb88', '#121a28', n));
    c.fillStyle = gg; c.fillRect(0, GROUND, worldW, bottom - GROUND);
    c.fillStyle = mix('#8a6a40', '#5d6f8e', n); c.fillRect(0, GROUND - 0.4, worldW, 1.2);
    c.fillStyle = mix('#c2a571', '#33435e', n);
    for (const p of S.pebbles) { c.beginPath(); c.ellipse(p.x, p.y, p.w * 0.7, 0.55, 0, 0, Math.PI * 2); c.fill(); }

    for (const o of S.obs) {
      if (o.kind === 'box') boxHD(c, o.x, o.y, n);
      else if (o.kind === 'drum') drumHD(c, o.x, o.y, o.paint, n);
      else if (o.kind === 'box2') { boxHD(c, o.x, o.y, n); boxHD(c, o.x + 24, o.y, n); }
      else if (o.kind === 'stack') { boxHD(c, o.x, o.y + 24, n); boxHD(c, o.x, o.y, n); }
      else if (o.kind === 'crow') crowHD(c, o.x, o.y, S.t, n);
    }

    const ch = CHARS[charId];
    const moving = S.mode === 'run' || S.mode === 'menu';
    const ducking = S.duckHeld && S.hero.y === 0 && S.mode === 'run';
    const pose = ducking ? 'duck' : S.hero.y > 0 ? 'air' : moving ? 'run' : 'idle';
    const cx = HERO_X + 18 - heroCenterOffset(ch) * HERO_HD_SCALE;
    c.fillStyle = 'rgba(0,0,0,' + (0.22 * Math.max(0.25, 1 - S.hero.y / 70)).toFixed(3) + ')';
    c.beginPath(); c.ellipse(HERO_X + 18, GROUND + 1, 11 * Math.max(0.5, 1 - S.hero.y / 120), 1.8, 0, 0, Math.PI * 2); c.fill();
    drawHeroVector(c, ch, cx, GROUND - S.hero.y, pose, S.t * 13, HERO_HD_SCALE);
  }

  function drawPreviewHD(cvs, ch, t) {
    const c2 = cvs.getContext('2d');
    c2.setTransform(1, 0, 0, 1, 0, 0);
    const W = cvs.width, H = cvs.height, groundH = Math.round(H * 0.16);
    const sky = c2.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#5fb6ff'); sky.addColorStop(1, '#e9f7ff');
    c2.fillStyle = sky; c2.fillRect(0, 0, W, H);
    const gg = c2.createLinearGradient(0, H - groundH, 0, H);
    gg.addColorStop(0, '#f3e4c0'); gg.addColorStop(1, '#d6bb88');
    c2.fillStyle = gg; c2.fillRect(0, H - groundH, W, groundH);
    c2.fillStyle = '#8a6a40'; c2.fillRect(0, H - groundH, W, Math.max(1, H / 120));
    const s = (H - groundH) * 0.86 / 56;
    c2.fillStyle = 'rgba(0,0,0,0.18)';
    c2.beginPath(); c2.ellipse(W / 2, H - groundH + s, 13 * s, 2 * s, 0, 0, Math.PI * 2); c2.fill();
    drawHeroVector(c2, ch, W / 2 - heroCenterOffset(ch) * s, H - groundH, t > 0 ? 'run' : 'idle', t * 12, s);
  }

  function draw() { if (hd) drawHD(); else drawPixel(); }

  function drawPixel() {
    const n = S.night, top = skyTop(), bottom = viewH - offY;

    const sky = ctx.createLinearGradient(0, top, 0, GROUND);
    sky.addColorStop(0, mix('#6fc0ff', '#050b17', n));
    sky.addColorStop(1, mix('#e8f6ff', '#1a2b47', n));
    ctx.fillStyle = sky;
    ctx.fillRect(0, top, worldW, GROUND - top);

    const orbTop = top * 0.55 + 70;
    const sunY = orbTop + n * 90, moonY = orbTop + 90 - n * 90;
    if (n < 1) { ctx.globalAlpha = 1 - n; drawGrid(ctx, SPR.sun, worldW * 0.68, sunY, '#ffc531'); }
    if (n > 0) {
      for (const st of S.stars) {
        ctx.globalAlpha = n * (0.55 + 0.45 * Math.sin(S.t * 2 + st.tw));
        ctx.fillStyle = '#f2f5ff';
        ctx.fillRect(Math.round(st.x % (worldW + 8)), Math.round(st.y), st.s, st.s);
      }
      ctx.globalAlpha = n;
      drawGrid(ctx, SPR.moon, worldW * 0.68, moonY, '#f4ecc2');
    }
    ctx.globalAlpha = 1;

    const cloudMap = { w: mix('#ffffff', '#3d4c69', n), s: mix('#cfe3f5', '#2b3852', n) };
    for (const cl of S.clouds) drawSprite(ctx, SPR.cloud, cl.x, cl.y, cloudMap);

    ctx.fillStyle = mix('#efe1bf', '#1a2333', n);
    ctx.fillRect(0, GROUND, worldW, bottom - GROUND);
    ctx.fillStyle = mix('#e2cd9f', '#151d2b', n);
    ctx.fillRect(0, GROUND + 22, worldW, bottom - GROUND - 22);
    ctx.fillStyle = mix('#7a5a35', '#5d6f8e', n);
    ctx.fillRect(0, GROUND, worldW, 1);
    ctx.fillStyle = mix('#c4a877', '#33435e', n);
    for (const p of S.pebbles) ctx.fillRect(Math.round(p.x), p.y, p.w, 1);

    const boxMap = { d: dim('#9a6634', n), b: dim('#d39a5a', n), t: dim('#f1dfae', n) };
    const crowMap = { '#': mix('#2b2d3a', '#0b0f18', n), y: dim('#ffb000', n) };
    for (const o of S.obs) {
      if (o.kind === 'box') drawSprite(ctx, SPR.box, o.x, o.y, boxMap);
      else if (o.kind === 'drum') drawSprite(ctx, SPR.drum, o.x, o.y, { b: dim(o.paint, n), d: dim('#2b2e35', n), h: dim('#e9edf2', n), y: dim('#f2c230', n) });
      else if (o.kind === 'box2') { drawSprite(ctx, SPR.box, o.x, o.y, boxMap); drawSprite(ctx, SPR.box, o.x + 24, o.y, boxMap); }
      else if (o.kind === 'stack') { drawSprite(ctx, SPR.box, o.x, o.y, boxMap); drawSprite(ctx, SPR.box, o.x, o.y + 24, boxMap); }
      else if (o.kind === 'crow') {
        const g = Math.floor(S.t * 6) % 2 ? SPR.crowUp : SPR.crowDown;
        if (n > 0.5) { ctx.globalAlpha = 0.5; drawGrid(ctx, g, o.x, o.y + 1, '#8fa3c7'); ctx.globalAlpha = 1; }
        drawSprite(ctx, g, o.x, o.y, crowMap);
      }
    }

    const moving = S.mode === 'run' || S.mode === 'menu';
    const ducking = S.duckHeld && S.hero.y === 0 && S.mode === 'run';
    const stepF = moving && S.hero.y === 0 ? Math.floor(S.t * 12) % 2 : 0;
    const ch = CHARS[charId];
    const g = ducking ? ch.duck[stepF] : ch.run[stepF];
    drawSprite(ctx, g, HERO_X, GROUND - (ducking ? 0 : S.hero.y) - g.length * P, ch.colors);
  }

  /* ---------- character picker (in the menu) ---------- */
  const charsEl = $('chars'), big = $('bigPreview');
  function drawPreview(cvs, ch, frame, px, t = 0) {
    if (hd) return drawPreviewHD(cvs, ch, t);
    const c2 = cvs.getContext('2d');
    c2.setTransform(1, 0, 0, 1, 0, 0);
    c2.imageSmoothingEnabled = false;
    const W = cvs.width, H = cvs.height, groundH = Math.round(H * 0.16);
    const sky = c2.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#6fc0ff'); sky.addColorStop(1, '#e8f6ff');
    c2.fillStyle = sky; c2.fillRect(0, 0, W, H);
    c2.fillStyle = '#efe1bf'; c2.fillRect(0, H - groundH, W, groundH);
    c2.fillStyle = '#7a5a35'; c2.fillRect(0, H - groundH, W, Math.max(1, px / 2));
    const grid = ch.run[frame];
    const w = Math.max(...grid.map(r => r.length)) * px, h = grid.length * px;
    drawSprite(c2, grid, (W - w) / 2, H - groundH - h, ch.colors, px);
  }
  function buildPicker() {
    charsEl.innerHTML = '';
    for (const id of CHAR_IDS) {
      const ch = CHARS[id];
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'char'; b.id = 'char-' + id; b.dataset.id = id;
      const cvs = document.createElement('canvas'); cvs.width = 192; cvs.height = 120;
      drawPreview(cvs, ch, 0, 4);
      const label = document.createElement('span'); label.textContent = ch.name;
      b.append(cvs, label);
      b.addEventListener('click', () => selectChar(id));
      charsEl.append(b);
    }
  }
  function refreshPicker() {
    const ch = CHARS[charId];
    charsEl.querySelectorAll('.char').forEach(el => el.setAttribute('aria-pressed', el.dataset.id === charId ? 'true' : 'false'));
    $('heroName').textContent = ch.name;
    $('heroTag').textContent = ch.tag;
    document.documentElement.style.setProperty('--hero', ch.hero);
    drawPreview(big, ch, 0, 12);
  }
  function selectChar(id) {
    if (!CHARS[id]) return;
    charId = id;
    try { localStorage.setItem('roboBeatChar', id); } catch (e) {}
    refreshPicker();
    ensureAudio(); sfx.pick();
  }
  function setRes(on, silent) {
    hd = on;
    try { localStorage.setItem('roboBeatRes', on ? '1080' : '240'); } catch (e) {}
    document.body.classList.toggle('hd', on);
    $('res240').setAttribute('aria-pressed', on ? 'false' : 'true');
    $('res1080').setAttribute('aria-pressed', on ? 'true' : 'false');
    lastBigFrame = -1;
    buildPicker();
    refreshPicker();
    if (!silent) { ensureAudio(); sfx.pick(); }
  }
  function cycleChar(d) {
    const i = CHAR_IDS.indexOf(charId);
    selectChar(CHAR_IDS[(i + d + CHAR_IDS.length) % CHAR_IDS.length]);
  }

  /* ---------- loop ---------- */
  let last = performance.now(), lastBigFrame = -1;
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    if (S.mode === 'menu') {
      if (hd) drawPreview(big, CHARS[charId], 0, 12, S.t + 0.01);
      else {
        const f = Math.floor(S.t * 7) % 2;
        if (f !== lastBigFrame) { lastBigFrame = f; drawPreview(big, CHARS[charId], f, 12); }
      }
    }
    requestAnimationFrame(loop);
  }

  /* ---------- input ---------- */
  cv.addEventListener('pointerdown', e => { e.preventDefault(); press(); });
  cv.addEventListener('pointerup', release);
  cv.addEventListener('pointercancel', release);
  cv.addEventListener('pointerleave', () => { if (S.jumpHeld) release(); });

  btnJump.addEventListener('pointerdown', e => { e.preventDefault(); btnJump.classList.add('on'); press(); });
  const jUp = () => { btnJump.classList.remove('on'); release(); };
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => btnJump.addEventListener(ev, jUp));
  btnDuck.addEventListener('pointerdown', e => { e.preventDefault(); btnDuck.classList.add('on'); ensureAudio(); S.duckHeld = true; });
  const dUp = () => { btnDuck.classList.remove('on'); S.duckHeld = false; };
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => btnDuck.addEventListener(ev, dUp));
  [btnJump, btnDuck, cv].forEach(b => b.addEventListener('contextmenu', e => e.preventDefault()));

  $('btnStart').addEventListener('click', start);
  $('btnRetry').addEventListener('click', start);
  $('btnResume').addEventListener('click', resume);
  $('btnPause').addEventListener('click', pause);
  $('btnMenu1').addEventListener('click', toMenu);
  $('btnMenu2').addEventListener('click', toMenu);
  $('res240').addEventListener('click', () => setRes(false));
  $('res1080').addEventListener('click', () => setRes(true));
  $('prevChar').addEventListener('click', () => cycleChar(-1));
  $('nextChar').addEventListener('click', () => cycleChar(1));
  document.querySelectorAll('.sound-toggle').forEach(b => b.addEventListener('click', toggleSound));

  const JUMP_KEYS = ['Space', 'ArrowUp', 'KeyW'], DUCK_KEYS = ['ArrowDown', 'KeyS'];
  window.addEventListener('keydown', e => {
    if (e.code === 'KeyM' && !e.repeat) { toggleSound(); return; }
    if (S.mode === 'menu') {
      if (e.code === 'ArrowLeft') { e.preventDefault(); cycleChar(-1); }
      else if (e.code === 'ArrowRight') { e.preventDefault(); cycleChar(1); }
      else if (e.code === 'Space' && !e.repeat) { e.preventDefault(); start(); }
      return;
    }
    if (S.mode === 'run') {
      if (JUMP_KEYS.includes(e.code)) { e.preventDefault(); if (!e.repeat) press(); }
      else if (DUCK_KEYS.includes(e.code)) { e.preventDefault(); ensureAudio(); S.duckHeld = true; }
      else if ((e.code === 'Escape' || e.code === 'KeyP') && !e.repeat) pause();
      return;
    }
    if (S.mode === 'paused' && (e.code === 'Escape' || e.code === 'KeyP') && !e.repeat) { resume(); return; }
    if (S.mode === 'over' && e.code === 'Space' && !e.repeat && performance.now() - S.overAt > 450) { e.preventDefault(); start(); }
  });
  window.addEventListener('keyup', e => {
    if (JUMP_KEYS.includes(e.code)) release();
    else if (DUCK_KEYS.includes(e.code)) S.duckHeld = false;
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

  /* ---------- boot ---------- */
  new ResizeObserver(() => resize()).observe(cv);
  resize();
  setRes(hd, true);
  syncSoundBtns();
  toMenu();
  draw();
  requestAnimationFrame(t => { last = t; loop(t); });
})();
</script>
</body>
</html>
